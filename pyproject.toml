[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "homelab-monitor-toolkit"
version = "0.1.0"
description = "Agent-server monitoring platform for HomeLab infrastructure"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "ChinDurex" }]
dependencies = [
  "alembic",
  "fastapi",
  "httpx",
  "psutil",
  "pydantic-settings",
  "sqlalchemy",
  "uvicorn[standard]",
]

[project.scripts]
homelab-agent = "homelab_agent.cli:main"

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "ruff",
]

[tool.hatch.build.targets.wheel]
packages = [
  "agent/src/homelab_agent",
  "api/src/homelab_monitor",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["agent/src", "api/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
