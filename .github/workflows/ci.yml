name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: API and agent quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HOMELAB_REGISTRATION_KEY: ci-registration-key-at-least-24-chars
      HOMELAB_JWT_SECRET: ci-jwt-secret-key-at-least-32-characters
      HOMELAB_DATABASE_URL: sqlite:////tmp/homelab-monitor-ci.db
      HOMELAB_LOG_LEVEL: WARNING
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install ".[dev]"

      - name: Check migrations
        run: |
          alembic upgrade head
          alembic check

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Test
        run: pytest
